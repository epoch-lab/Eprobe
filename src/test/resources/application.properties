spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test-mail@example.com
spring.mail.password=test-auth-code
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.security.jwt.secret=test-jwt-secret-key-with-at-least-32-bytes-long
app.security.jwt.expire-seconds=7200
app.security.jwt.remember-expire-seconds=2592000
app.security.jwt.cookie-name=lab_recruit_token
app.security.jwt.csrf-cookie-name=XSRF-TOKEN
app.security.jwt.csrf-header-name=X-CSRF-TOKEN
app.security.jwt.cookie-secure=false
app.security.jwt.cookie-same-site=Lax
app.auth.email-code.ttl-seconds=300
app.auth.email-code.send-cooldown-seconds=60
app.auth.login.max-fail-count=5
app.auth.login.fail-lock-seconds=900
app.auth.cache-type=redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
app.bootstrap.default-admin.enabled=true
app.bootstrap.default-admin.username=test_admin
app.bootstrap.default-admin.password=TestAdmin123
app.bootstrap.default-admin.email=test_admin@example.com
