# suppress inspection "SpringBootApplicationProperties" for whole file
spring.application.name=backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fresh?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&sessionVariables=default_storage_engine=InnoDB}
spring.datasource.username=${DB_USERNAME:epoch}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
spring.mail.host=${MAIL_SMTP_HOST:}
spring.mail.port=${MAIL_SMTP_PORT:465}
spring.mail.username=${MAIL_ACCOUNT:}
spring.mail.password=${MAIL_AUTH_CODE:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:256MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:256MB}
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expire-seconds=7200
app.security.jwt.remember-expire-seconds=2592000
app.security.jwt.cookie-name=lab_recruit_token
app.security.jwt.csrf-cookie-name=XSRF-TOKEN
app.security.jwt.csrf-header-name=X-CSRF-TOKEN
app.security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
app.security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Strict}
app.auth.email-code.ttl-seconds=300
app.auth.email-code.send-cooldown-seconds=60
app.auth.email-code.max-verify-fail-count=5
app.auth.email-code.verify-lock-seconds=300
app.auth.email-code.ip-send-window-seconds=${AUTH_EMAIL_CODE_IP_SEND_WINDOW_SECONDS:3600}
app.auth.email-code.max-ip-send-count=${AUTH_EMAIL_CODE_MAX_IP_SEND_COUNT:30}
app.auth.email-code.global-send-window-seconds=${AUTH_EMAIL_CODE_GLOBAL_SEND_WINDOW_SECONDS:60}
app.auth.email-code.max-global-send-count=${AUTH_EMAIL_CODE_MAX_GLOBAL_SEND_COUNT:300}
app.auth.login.max-fail-count=5
app.auth.login.fail-lock-seconds=900
app.auth.login.trust-forward-headers=${AUTH_TRUST_FORWARD_HEADERS:false}
app.auth.login.trusted-proxies=${AUTH_TRUSTED_PROXIES:}
app.auth.cache-type=${AUTH_CACHE_TYPE:redis}
app.recruitment.application.allowed-grades=${APPLICATION_ALLOWED_GRADES:YEAR_1,YEAR_2}
app.storage.root-path=${APP_STORAGE_ROOT:./storage}
app.storage.chunk-size=${APP_STORAGE_CHUNK_SIZE:0B}
app.storage.cleanup-enabled=${APP_STORAGE_CLEANUP_ENABLED:true}
app.storage.temp-session-ttl=${APP_STORAGE_TEMP_SESSION_TTL:24h}
app.storage.orphan-file-ttl=${APP_STORAGE_ORPHAN_FILE_TTL:24h}
app.storage.allowed-extensions=${APP_STORAGE_ALLOWED_EXTENSIONS:pdf,doc,docx,xls,xlsx,ppt,pptx,zip,rar,7z,txt,md,png,jpg,jpeg,gif,webp,json,java,py,c,cpp,js,ts}
app.storage.allowed-content-types=${APP_STORAGE_ALLOWED_CONTENT_TYPES:application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/zip,application/x-zip-compressed,application/x-rar-compressed,application/x-7z-compressed,text/plain,text/markdown,text/x-markdown,text/markdown;charset=UTF-8,image/png,image/jpeg,image/gif,image/webp,application/json,text/javascript,application/javascript,text/x-java-source,text/x-python,text/x-c,text/x-c++src}
app.task.attachment-max-size=${TASK_ATTACHMENT_MAX_SIZE:20MB}
app.audit.major-event-log-file-path=${APP_AUDIT_MAJOR_EVENT_LOG_FILE_PATH:./logs/business-audit.log}
app.bootstrap.default-admin.enabled=${DEFAULT_ADMIN_ENABLED:true}
app.bootstrap.default-admin.username=${DEFAULT_ADMIN_USERNAME:}
app.bootstrap.default-admin.password=${DEFAULT_ADMIN_PASSWORD:}
app.bootstrap.default-admin.email=${DEFAULT_ADMIN_EMAIL:}
app.brand.name=${APP_BRAND_NAME:FRESH}